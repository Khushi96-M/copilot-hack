<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple student study planner for organizing school tasks."
    />
    <title>Student Study Planner</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">Stay on track</p>
        <h1>Student Study Planner</h1>
        <p class="intro">
          Add your study tasks, check them off when they are done, and keep
          your day organized.
        </p>
      </header>

      <section class="planner-card" aria-labelledby="add-task-heading">
        <h2 id="add-task-heading">Add a task</h2>
        <form id="task-form" class="task-form">
          <div class="input-group">
            <label for="task-input">Task name</label>
            <input
              id="task-input"
              name="task"
              type="text"
              maxlength="100"
              placeholder="e.g. Review chapter 3 notes"
              autocomplete="off"
              required
            />
            <p id="form-message" class="form-message" role="alert"></p>
          </div>
          <button class="button button-primary" type="submit">Add task</button>
        </form>
      </section>

      <section class="planner-card" aria-labelledby="tasks-heading">
        <div class="tasks-header">
          <h2 id="tasks-heading">My tasks</h2>
          <p id="task-count" class="task-count" aria-live="polite">0 tasks</p>
        </div>

        <p id="empty-state" class="empty-state">
          No tasks yet. Add your first study task above!
        </p>
        <ul id="task-list" class="task-list" aria-label="Study tasks"></ul>
      </section>
    </main>
  </body>
</html>
